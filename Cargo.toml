[package]
name = "binary-install"
description = "Install a binary from a path to a global cache"
authors = ["Rust and WebAssembly Working Group"]
repository = "https://github.com/rustwasm/binary-install"
license = "MIT/Apache-2.0"
version = "0.6.0"
documentation = "https://docs.rs/binary-install"
readme = "./README.md"
edition = "2018"

[dependencies]
anyhow = "1.0.104"
ureq = {version = "3.5.0", features = ["socks-proxy"] }
dirs-next = "2.0.0"
flate2 = "1.1.10"
hex = "0.4.3"
is_executable = "1.0.6"
siphasher = "1.0.4"
tar = "0.4.46"
zip = "9.1.0"

[dev-dependencies]
tempfile = "3.27.0"
